<rect width="1600" height="980" fill="#FFFFFF"/>
<text x="48" y="64" font-size="32" font-weight="700" fill="#1F1A2B" text-anchor="start">SimPilot — system architecture</text>
<text x="48" y="96" font-size="16" font-weight="400" fill="#6B6478" text-anchor="start">A local AI agent and ML engine on two ASUS UGen nodes. Data stays on-premise; researchers approve every simulation run.</text>
