   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153344" x="47.232" y="38.88" transform="rotate(-0 47.232 38.88)">System architecture</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536878" x="47.232" y="71.712" transform="rotate(-0 47.232 71.712)">Implemented local workbench  |  Browser + Python  |  CSV demo needs no Google account or API key</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="230.4" y="147.803187" transform="rotate(-0 230.4 147.803187)">Researcher + browser UI</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(102.809414 182.299723)">Choose target, data, kernels and review settings</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(180.781758 196.450934)">gp_frontend/static/</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="783.36" y="147.803187" transform="rotate(-0 783.36 147.803187)">Local HTTP server + Workbench service</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(664.860937 182.299723)">127.0.0.1 only; session / Host / Origin checks</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(691.023164 196.450934)">gp_frontend/server.py + service.py</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #536878" x="439.1424" y="146.268" transform="rotate(-0 439.1424 146.268)">local API</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="174.7584" y="298.283187" transform="rotate(-0 174.7584 298.283187)">Local input</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(107.053088 346.370133)">CSV + matching manifest</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(95.450588 360.521344)">Five recipe examples included</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(79.371642 374.672555)">Normalization, units, shell metadata</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="442.2528" y="298.232406" transform="rotate(-0 442.2528 298.232406)">Target extraction</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(390.805261 346.370133)">q* / M / low-q mean</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(357.749948 360.521344)">Declared time window + q band</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(363.149245 374.672555)">Quality checks before training</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="709.7472" y="298.232406" transform="rotate(-0 709.7472 298.232406)">GP modeling</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(682.339739 346.224117)">gp_model/</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(642.317513 360.667359)">Fold-local scaling + LORO</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(622.726809 374.81857)">Selected kernels + two baselines</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="977.2416" y="298.283187" transform="rotate(-0 977.2416 298.283187)">Evaluation</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(955.168631 346.224117)">gp_eval/</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(902.412694 360.667359)">Held-out error + uncertainty</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(890.867616 374.81857)">Interpolation / extrapolation split</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536878" x="738.432" y="239.976" transform="rotate(-0 738.432 239.976)">calls analysis / training</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="230.4" y="472.703187" transform="rotate(-0 230.4 472.703187)">Optional own data</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(116.008242 503.925738)">Local raw frames or read-only Google Drive</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(140.805469 518.076949)">Raw processing -&gt; derived curves</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #536878" x="185.472" y="416.448" transform="rotate(-0 185.472 416.448)">local computation</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153344" x="783.36" y="472.703187" transform="rotate(-0 783.36 472.703187)">Local outputs and researcher review</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(625.348945 503.925738)">Reports, prediction tables, JSON models, history -&gt; runtime/</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #536878" transform="translate(577.966055 518.076949)">Results return through the local API; custom runtime files need privacy review</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #536878" x="1097.856" y="555.984" transform="rotate(-0 1097.856 555.984)">Future work: LLM agent orchestration, active learning and automatic MD dispatch.</text>
   </g>
